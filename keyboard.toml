# Documentation: https://haobogu.github.io/rmk/keyboard_configuration.html
[keyboard]
name = "awe-kbd"
product_name = "awe-kbd"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "drin"
chip = "nrf52840"
dependency.defmt_log = true

